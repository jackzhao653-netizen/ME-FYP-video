<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
    <defs>
        <!-- Glow Filters -->
        <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
            <feFlood flood-color="#FFF500" result="yellowColor"/>
            <feComposite in="yellowColor" in2="SourceAlpha" operator="in" result="yellowGlow"/>
            <feGaussianBlur in="yellowGlow" stdDeviation="6" result="blurredYellow"/>
            <feMerge>
                <feMergeNode in="blurredYellow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glowViolet" x="-50%" y="-50%" width="200%" height="200%">
            <feFlood flood-color="#E286FF" result="violetColor"/>
            <feComposite in="violetColor" in2="SourceAlpha" operator="in" result="violetGlow"/>
            <feGaussianBlur in="violetGlow" stdDeviation="6" result="blurredViolet"/>
            <feMerge>
                <feMergeNode in="blurredViolet"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
            <feFlood flood-color="#00FFFF" result="cyanColor"/>
            <feComposite in="cyanColor" in2="SourceAlpha" operator="in" result="cyanGlow"/>
            <feGaussianBlur in="cyanGlow" stdDeviation="4" result="blurredCyan"/>
            <feMerge>
                <feMergeNode in="blurredCyan"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glowBulb" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        </pattern>
        
        <!-- Electron Path -->
        <path id="electronPath" d="M 655 340 L 655 150 Q 655 130 635 130 L 530 130 Q 515 130 515 115 L 508 90 Q 508 65 524 48 Q 500 20 476 48 Q 492 65 492 90 L 485 115 Q 485 130 470 130 L 365 130 Q 345 130 345 150 L 345 340" fill="none" stroke="none"/>

        <g id="electron">
            <circle cx="0" cy="0" r="10" fill="#00FFFF" stroke="#00FFFF" stroke-width="2" filter="url(#glowCyan)"/>
            <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#111111">e⁻</text>
        </g>
    </defs>

    <rect width="1000" height="600" fill="#4AA2DF"/>
    <rect width="1000" height="600" fill="url(#grid)"/>

    <rect id="central-bg" x="360" y="180" width="280" height="340" fill="#1a1a1a" />

    <path d="M 360 320 H 340 V 360 H 360" fill="#1a1a1a"/>
    <circle cx="340" cy="340" r="20" fill="#1a1a1a"/>
    <path d="M 640 320 H 660 V 360 H 640" fill="#1a1a1a"/>
    <circle cx="660" cy="340" r="20" fill="#1a1a1a"/>

    <path d="M 368 328 H 345 V 352 H 368" fill="#4B4B4B" />
    <circle cx="345" cy="340" r="12" fill="#4B4B4B" />
    <path d="M 632 328 H 655 V 352 H 632" fill="#4B4B4B" />
    <circle cx="655" cy="340" r="12" fill="#4B4B4B" />

    <!-- Structural Cell columns -->
    <rect x="368" y="186" width="22" height="328" fill="#4B4B4B"/>
    <rect x="610" y="186" width="22" height="328" fill="#4B4B4B"/>

    <!-- Wires Backgrounds and Inner Fills -->
    <path d="M 655 340 L 655 150 Q 655 130 635 130 L 530 130 Q 515 130 515 115" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 655 340 L 655 150 Q 655 130 635 130 L 530 130 Q 515 130 515 115" fill="none" stroke="#222222" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

    <path d="M 345 340 L 345 150 Q 345 130 365 130 L 470 130 Q 485 130 485 115" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 345 340 L 345 150 Q 345 130 365 130 L 470 130 Q 485 130 485 115" fill="none" stroke="#E74C3C" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Light Bulb Pulse Glow -->
    <path d="M 482 90 C 482 70, 465 65, 465 40 A 35 35 0 1 1 535 40 C 535 65, 518 70, 518 90 Z" fill="#FFB338" filter="url(#glowBulb)" opacity="0">
        <animate attributeName="opacity" from="0" to="0.3" dur="2.0s" begin="6.0s" fill="freeze" />
        <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="1.5s" repeatCount="indefinite" begin="8.0s" />
    </path>

    <!-- Bulb Glass -->
    <path d="M 482 90 C 482 70, 465 65, 465 40 A 35 35 0 1 1 535 40 C 535 65, 518 70, 518 90 Z" fill="#555555">
        <animate attributeName="fill" from="#555555" to="#FFB338" dur="2.0s" begin="6.0s" fill="freeze" />
    </path>

    <!-- Filaments -->
    <path d="M 492 90 Q 492 65 476 48" fill="none" stroke="#444444" stroke-width="6" stroke-linecap="round">
        <animate attributeName="stroke" from="#444444" to="#FAD183" dur="2.0s" begin="6.0s" fill="freeze" />
    </path>
    <path d="M 508 90 Q 508 65 524 48" fill="none" stroke="#444444" stroke-width="6" stroke-linecap="round">
        <animate attributeName="stroke" from="#444444" to="#FAD183" dur="2.0s" begin="6.0s" fill="freeze" />
    </path>

    <!-- Light Bulb Base -->
    <path d="M 488 113 A 12 12 0 0 0 512 113 Z" fill="#A6A6A6"/>
    <rect x="484" y="104" width="32" height="10" rx="4" fill="#C5C5C5"/>
    <rect x="480" y="97" width="40" height="10" rx="4" fill="#A6A6A6"/>
    <rect x="477" y="89" width="46" height="10" rx="4" fill="#C5C5C5"/>

    <!-- Central Color Fills (Starts Empty) -->
    <rect id="central-left-fluid" x="390" y="514" width="110" height="0" fill="#D4AC0D">
        <animate attributeName="y" from="514" to="186" begin="1.1s" dur="1.8s" fill="freeze" />
        <animate attributeName="height" from="0" to="328" begin="1.1s" dur="1.8s" fill="freeze" />
    </rect>
    <rect id="central-right-fluid" x="500" y="514" width="110" height="0" fill="#7B3BC9">
        <animate attributeName="y" from="514" to="186" begin="3.6s" dur="1.8s" fill="freeze" />
        <animate attributeName="height" from="0" to="328" begin="3.6s" dur="1.8s" fill="freeze" />
    </rect>

    <line x1="500" y1="184" x2="500" y2="516" stroke="#2B2B2B" stroke-width="4" stroke-dasharray="10, 8" />

    <!-- Beaker L (Slides from side to top, pours, and fades out) -->
    <g opacity="1">
        <animate attributeName="opacity" values="1; 1; 0" keyTimes="0; 0.95; 1" begin="0s" dur="3s" fill="freeze" />
        <g transform="translate(150, 520)">
            <animateTransform attributeName="transform" type="translate" 
                values="150 520; 150 520; 363 100; 363 100" 
                keyTimes="0; 0.166; 0.333; 1" begin="0s" dur="3s" fill="freeze"/>
            <g transform="rotate(0)">
                <animateTransform attributeName="transform" type="rotate"
                    values="0; 0; 60; 60"
                    keyTimes="0; 0.166; 0.333; 1" begin="0s" dur="3s" fill="freeze"/>
                <rect x="-75" y="-100" width="75" height="100" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="6"/>
                <rect x="-72" y="-96" width="69" height="85" fill="#D4AC0D">
                    <animate attributeName="y" from="-96" to="-10" begin="1.1s" dur="1.8s" fill="freeze" />
                    <animate attributeName="height" from="85" to="0" begin="1.1s" dur="1.8s" fill="freeze" />
                </rect>
                <!-- Counter-rotate text so it stays upright -->
                <text x="-37" y="-45" font-family="Arial" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">
                    <animateTransform attributeName="transform" type="rotate" values="0 -37 -45; 0 -37 -45; -60 -37 -45; -60 -37 -45" keyTimes="0; 0.166; 0.333; 1" begin="0s" dur="3s" fill="freeze" />
                    V5+
                </text>
            </g>
        </g>
    </g>
    <!-- Stream L -->
    <rect x="445" y="70" width="16" height="0" fill="#D4AC0D">
        <animate attributeName="height" from="0" to="444" begin="1.0s" dur="0.2s" fill="freeze" />
        <animate attributeName="opacity" to="0" begin="2.9s" dur="0.1s" fill="freeze" />
    </rect>

    <!-- Beaker R (Slides from side to top, pours, and fades out) -->
    <g opacity="1">
        <animate attributeName="opacity" values="1; 1; 0" keyTimes="0; 0.95; 1" begin="2.5s" dur="3s" fill="freeze" />
        <g transform="translate(850, 520)">
            <animateTransform attributeName="transform" type="translate" 
                values="850 520; 850 520; 637 100; 637 100" 
                keyTimes="0; 0.166; 0.333; 1" begin="2.5s" dur="3s" fill="freeze"/>
            <g transform="rotate(0)">
                <animateTransform attributeName="transform" type="rotate"
                    values="0; 0; -60; -60"
                    keyTimes="0; 0.166; 0.333; 1" begin="2.5s" dur="3s" fill="freeze"/>
                <rect x="0" y="-100" width="75" height="100" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="6"/>
                <rect x="3" y="-96" width="69" height="85" fill="#7B3BC9">
                    <animate attributeName="y" from="-96" to="-10" begin="3.6s" dur="1.8s" fill="freeze" />
                    <animate attributeName="height" from="85" to="0" begin="3.6s" dur="1.8s" fill="freeze" />
                </rect>
                <text x="37" y="-45" font-family="Arial" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">
                    <animateTransform attributeName="transform" type="rotate" values="0 37 -45; 0 37 -45; 60 37 -45; 60 37 -45" keyTimes="0; 0.166; 0.333; 1" begin="2.5s" dur="3s" fill="freeze" />
                    V2+
                </text>
            </g>
        </g>
    </g>
    <!-- Stream R -->
    <rect x="546" y="70" width="16" height="0" fill="#7B3BC9">
        <animate attributeName="height" from="0" to="444" begin="3.5s" dur="0.2s" fill="freeze" />
        <animate attributeName="opacity" to="0" begin="5.4s" dur="0.1s" fill="freeze" />
    </rect>

    <!-- Electrons Overlay -->
    <use href="#electron" opacity="0">
        <animate attributeName="opacity" to="1" begin="6s" dur="0.1s" fill="freeze" />
        <animateMotion dur="8s" repeatCount="indefinite" begin="6s"><mpath href="#electronPath" /></animateMotion>
    </use>
    <use href="#electron" opacity="0">
        <animate attributeName="opacity" to="1" begin="8s" dur="0.1s" fill="freeze" />
        <animateMotion dur="8s" repeatCount="indefinite" begin="8s"><mpath href="#electronPath" /></animateMotion>
    </use>
    <use href="#electron" opacity="0">
        <animate attributeName="opacity" to="1" begin="10s" dur="0.1s" fill="freeze" />
        <animateMotion dur="8s" repeatCount="indefinite" begin="10s"><mpath href="#electronPath" /></animateMotion>
    </use>
    <use href="#electron" opacity="0">
        <animate attributeName="opacity" to="1" begin="12s" dur="0.1s" fill="freeze" />
        <animateMotion dur="8s" repeatCount="indefinite" begin="12s"><mpath href="#electronPath" /></animateMotion>
    </use>

    <!-- Glowing Text on Fluid -->
    <text x="445" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#glowYellow)" opacity="0">
        V<tspan baseline-shift="super" font-size="14">5+</tspan>
        <animate attributeName="opacity" to="1" begin="2.9s" dur="0.5s" fill="freeze" />
    </text>
    <text x="555" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#glowViolet)" opacity="0">
        V<tspan baseline-shift="super" font-size="14">2+</tspan>
        <animate attributeName="opacity" to="1" begin="5.4s" dur="0.5s" fill="freeze" />
    </text>

    <!-- Subtitles Output (Reactions) -->
    <g opacity="0">
        <animate attributeName="opacity" to="1" begin="7s" dur="1s" fill="freeze" />
        <text x="480" y="550" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="end">V<tspan baseline-shift="super" font-size="12">5+</tspan> + e<tspan baseline-shift="super" font-size="12">−</tspan> → V<tspan baseline-shift="super" font-size="12">4+</tspan></text>
        <text x="520" y="550" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="start">V<tspan baseline-shift="super" font-size="12">2+</tspan> → V<tspan baseline-shift="super" font-size="12">3+</tspan> + e<tspan baseline-shift="super" font-size="12">−</tspan></text>
    </g>
</svg>
