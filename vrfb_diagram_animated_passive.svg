<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
    <defs>
        <!-- Glow Filters -->
        <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
            <feFlood flood-color="#FFF500" result="yellowColor"/>
            <feComposite in="yellowColor" in2="SourceAlpha" operator="in" result="yellowGlow"/>
            <feGaussianBlur in="yellowGlow" stdDeviation="6" result="blurredYellow"/>
            <feMerge>
                <feMergeNode in="blurredYellow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glowViolet" x="-50%" y="-50%" width="200%" height="200%">
            <feFlood flood-color="#E286FF" result="violetColor"/>
            <feComposite in="violetColor" in2="SourceAlpha" operator="in" result="violetGlow"/>
            <feGaussianBlur in="violetGlow" stdDeviation="6" result="blurredViolet"/>
            <feMerge>
                <feMergeNode in="blurredViolet"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
            <feFlood flood-color="#00FFFF" result="cyanColor"/>
            <feComposite in="cyanColor" in2="SourceAlpha" operator="in" result="cyanGlow"/>
            <feGaussianBlur in="cyanGlow" stdDeviation="4" result="blurredCyan"/>
            <feMerge>
                <feMergeNode in="blurredCyan"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glowBulb" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        </pattern>
        
        <!-- Electron Path: Right Terminal -> Right Wire -> Right Post -> Left Post -> Left Wire -> Left Terminal -->
        <path id="electronPath" d="M 655 340 L 655 150 Q 655 130 635 130 L 530 130 Q 515 130 515 115 L 508 90 Q 508 65 524 48 Q 500 20 476 48 Q 492 65 492 90 L 485 115 Q 485 130 470 130 L 365 130 Q 345 130 345 150 L 345 340" fill="none" stroke="none"/>
    </defs>

    <rect width="1000" height="600" fill="#4AA2DF"/>
    <rect width="1000" height="600" fill="url(#grid)"/>

    <rect id="central-bg" x="360" y="180" width="280" height="340" fill="#1a1a1a" />

    <path d="M 360 320 H 340 V 360 H 360" fill="#1a1a1a"/>
    <circle cx="340" cy="340" r="20" fill="#1a1a1a"/>
    <path d="M 640 320 H 660 V 360 H 640" fill="#1a1a1a"/>
    <circle cx="660" cy="340" r="20" fill="#1a1a1a"/>

    <path d="M 368 328 H 345 V 352 H 368" fill="#4B4B4B" />
    <circle cx="345" cy="340" r="12" fill="#4B4B4B" />
    <path d="M 632 328 H 655 V 352 H 632" fill="#4B4B4B" />
    <circle cx="655" cy="340" r="12" fill="#4B4B4B" />

    <!-- Structural Cell columns -->
    <rect x="368" y="186" width="22" height="328" fill="#4B4B4B"/>
    <rect x="610" y="186" width="22" height="328" fill="#4B4B4B"/>

    <!-- Wires Backgrounds and Inner Fills -->
    <!-- Right Wire (from Terminal 655, 340 to Light Bulb base) - Black Cable (Negative) -->
    <path d="M 655 340 L 655 150 Q 655 130 635 130 L 530 130 Q 515 130 515 115" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 655 340 L 655 150 Q 655 130 635 130 L 530 130 Q 515 130 515 115" fill="none" stroke="#222222" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Left Wire (from Terminal 345, 340 to Light Bulb base) - Red Cable (Positive) -->
    <path d="M 345 340 L 345 150 Q 345 130 365 130 L 470 130 Q 485 130 485 115" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 345 340 L 345 150 Q 345 130 365 130 L 470 130 Q 485 130 485 115" fill="none" stroke="#E74C3C" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Light Bulb Pulse Glow (Starts off, turns on at 3.0s) -->
    <path d="M 482 90 C 482 70, 465 65, 465 40 A 35 35 0 1 1 535 40 C 535 65, 518 70, 518 90 Z" fill="#FFB338" filter="url(#glowBulb)" opacity="0">
        <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="1.5s" repeatCount="indefinite" begin="3.0s" />
    </path>

    <!-- Bulb Glass (Glass starts dark grey, colors yellow at 3.0s) -->
    <path d="M 482 90 C 482 70, 465 65, 465 40 A 35 35 0 1 1 535 40 C 535 65, 518 70, 518 90 Z" fill="#555555">
        <animate attributeName="fill" from="#555555" to="#FFB338" dur="0.2s" begin="3.0s" fill="freeze" />
    </path>

    <!-- Filaments (thick curved stems, turn bright at 3.0s) -->
    <path d="M 492 90 Q 492 65 476 48" fill="none" stroke="#444444" stroke-width="6" stroke-linecap="round">
        <animate attributeName="stroke" from="#444444" to="#FAD183" dur="0.2s" begin="3.0s" fill="freeze" />
    </path>
    <path d="M 508 90 Q 508 65 524 48" fill="none" stroke="#444444" stroke-width="6" stroke-linecap="round">
        <animate attributeName="stroke" from="#444444" to="#FAD183" dur="0.2s" begin="3.0s" fill="freeze" />
    </path>

    <!-- Light Bulb Base (Stacked threaded overlapping boxes) -->
    <path d="M 488 113 A 12 12 0 0 0 512 113 Z" fill="#A6A6A6"/>
    <rect x="484" y="104" width="32" height="10" rx="4" fill="#C5C5C5"/>
    <rect x="480" y="97" width="40" height="10" rx="4" fill="#A6A6A6"/>
    <rect x="477" y="89" width="46" height="10" rx="4" fill="#C5C5C5"/>

    <!-- Central Color Fills -->
    <rect id="central-left-fluid" x="390" y="186" width="110" height="328" fill="#D4AC0D" />
    <rect id="central-right-fluid" x="500" y="186" width="110" height="328" fill="#7B3BC9" />

    <line x1="500" y1="184" x2="500" y2="516" stroke="#2B2B2B" stroke-width="4" stroke-dasharray="10, 8" />

    <!-- Electrons Overlay (Slower dur=8s, larger r=10) -->
    <g>
        <circle cx="0" cy="0" r="10" fill="#00FFFF" stroke="#00FFFF" stroke-width="2" filter="url(#glowCyan)"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#111111">e⁻</text>
        <animateMotion dur="8s" repeatCount="indefinite" begin="0s"><mpath href="#electronPath" /></animateMotion>
    </g>
    <g>
        <circle cx="0" cy="0" r="10" fill="#00FFFF" stroke="#00FFFF" stroke-width="2" filter="url(#glowCyan)"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#111111">e⁻</text>
        <animateMotion dur="8s" repeatCount="indefinite" begin="2s"><mpath href="#electronPath" /></animateMotion>
    </g>
    <g>
        <circle cx="0" cy="0" r="10" fill="#00FFFF" stroke="#00FFFF" stroke-width="2" filter="url(#glowCyan)"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#111111">e⁻</text>
        <animateMotion dur="8s" repeatCount="indefinite" begin="4s"><mpath href="#electronPath" /></animateMotion>
    </g>
    <g>
        <circle cx="0" cy="0" r="10" fill="#00FFFF" stroke="#00FFFF" stroke-width="2" filter="url(#glowCyan)"/>
        <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#111111">e⁻</text>
        <animateMotion dur="8s" repeatCount="indefinite" begin="6s"><mpath href="#electronPath" /></animateMotion>
    </g>

    <!-- Glowing Text -->
    <text x="445" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#glowYellow)">V<tspan baseline-shift="super" font-size="14">5+</tspan></text>
    <text x="555" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#glowViolet)">V<tspan baseline-shift="super" font-size="14">2+</tspan></text>

    <!-- Subtitles Output (Reactions) -->
    <text x="480" y="550" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="end">V<tspan baseline-shift="super" font-size="12">5+</tspan> + e<tspan baseline-shift="super" font-size="12">−</tspan> → V<tspan baseline-shift="super" font-size="12">4+</tspan></text>
    <text x="520" y="550" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="start">V<tspan baseline-shift="super" font-size="12">2+</tspan> → V<tspan baseline-shift="super" font-size="12">3+</tspan> + e<tspan baseline-shift="super" font-size="12">−</tspan></text>
</svg>
